[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab_husky"
version = "0.1.0"
license = "Apache-2.0"
description = "Humanoid Skateboarding System via Physics-Aware Whole-Body Control"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mjlab",
    "onnxruntime",
    "pybullet",
    "rsl-rl-lib",
    "pynput",
    # Runtime API versions tested with the pinned mjlab 1.0 revision.
    "mujoco==3.4.0",
    "warp-lang==1.11.0",
    "moviepy>=2.2.1,<3",
]

[project.entry-points."mjlab.tasks"]
mjlab_husky = "mjlab_husky.tasks"

[project.scripts]
train = "mjlab_husky.scripts.train:main"
play = "mjlab_husky.scripts.play:main"
husky-train = "mjlab_husky.scripts.train:main"
husky-play = "mjlab_husky.scripts.play:main"

[tool.ruff]
src = ["src"]  # Helpful for recognizing first-party imports.
indent-width = 4

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab.git", rev = "13212ad" }
rsl-rl-lib = { path = "rsl_rl" }
# mjlab 13212ad was developed against this MuJoCo-Warp API. uv does not
# inherit dependency projects' source overrides into the top-level project.
mujoco-warp = { git = "https://github.com/google-deepmind/mujoco_warp.git", rev = "1dc288cf1fa819fc3346ec5c9546e2cc2b7be667" }
