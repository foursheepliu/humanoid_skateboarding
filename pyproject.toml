[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab_husky"
version = "0.1.0"
license = "Apache-2.0"
description = "Humanoid Skateboarding System via Physics-Aware Whole-Body Control"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mjlab",
    "onnxruntime",
    "scipy>=1.16,<1.18",
    "pybullet",
    "rsl-rl-lib",
    "pynput"
]

[project.entry-points."mjlab.tasks"]
mjlab_husky = "mjlab_husky.tasks"

[project.scripts]
train = "mjlab_husky.scripts.train:main"
play = "mjlab_husky.scripts.play:main"
husky-train = "mjlab_husky.scripts.train:main"
husky-play = "mjlab_husky.scripts.play:main"
husky-supermimic = "mjlab_husky.supermimic.cli:main"

[tool.ruff]
src = ["src"]  # Helpful for recognizing first-party imports.
indent-width = 4

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab.git", rev = "13212ad" }
rsl-rl-lib = { path = "rsl_rl" }
mujoco = { index = "pypi" }
warp-lang = { index = "pypi" }

[tool.uv]
override-dependencies = ["mujoco==3.4.0", "warp-lang==1.11.0", "torch==2.10.0", "torchvision==0.25.0"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
